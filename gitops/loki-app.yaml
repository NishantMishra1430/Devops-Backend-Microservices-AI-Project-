apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki-stack
  namespace: argocd
spec:
  project: default
  source:
    chart: loki-stack
    repoURL: https://github.com/NishantMishra1430/Config-Repo-of-DevOps-Backend-Microservices-Application-.git
    targetRevision: main 
    helm:
      values: |
        grafana:
          enabled: false # We use the Grafana from prometheus-stack
        promtail:
          enabled: true
# ... (rest of the destination and syncPolicy remains identical to the Prometheus app)
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true