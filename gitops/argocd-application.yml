apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api-gateway
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/NishantMishra1430/Config-Repo-of-DevOps-Backend-Microservices-Application-.git'
    targetRevision: main
    path: charts/api-gateway
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: quant
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
