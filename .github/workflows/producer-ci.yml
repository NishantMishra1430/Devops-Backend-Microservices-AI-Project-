name: Producer CI Pipeline 

on:
  push:
    branches:
      - main
      - test
    paths:
      - "producer/**"
      - ".github/workflows/producer-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "producer/**"
      - ".github/workflows/producer-ci.yml"


jobs:
  Code-Review:
    runs-on: ubuntu-latest

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Credentials HardCoding Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GAT }}

  Image-Build-Scan-Push-To-Registry:
    runs-on: ubuntu-latest
    needs: Code-Review

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Image Build
        uses: docker/build-push-action@v5
        with:
          context: "./producer"
          load: True
          tags: quant-producer:${{github.sha}}

      - name: Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'quant-producer:${{github.sha}}'
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL"

      - name: Push To DockerHub
        run: |
          docker tag quant-producer:${{github.sha}} ${{ secrets.DOCKER_USERNAME }}/quant-producer:${{github.sha}}

          docker push ${{ secrets.DOCKER_USERNAME }}/quant-producer:${{github.sha}}


  Helm-GitOps-Update:
    runs-on: ubuntu-latest
    needs: Image-Build-Scan-Push-To-Registry

    concurrency:
      group: gitops-update
      cancel-in-progress: false
      queue: max

    if: github.event_name == 'push'

    steps:
      - name: Checkout Config Repository
        uses: actions/checkout@v4
        with:
          repository: NishantMishra1430/Config-Repo-of-DevOps-Backend-Microservices-Application-
          token: ${{ secrets.CONFIG_REPO_PAT }}
          path: config-repo
          fetch-depth: 0

      - name: Update Producer Image Tag
        run: |
          cd config-repo
          yq -i '.image.tag = "${{ github.sha }}"' charts/producer/values.yaml

      - name: Verify Helm Values Change
        run: |
          cd config-repo
          echo "Updated Producer image tag:"
          grep -A3 "^image:" charts/producer/values.yaml

      - name: Configure Git and Pull Latest State
        run: |
          cd config-repo
          git config user.name "${{secrets.GUN}}"
          git config user.email "${{secrets.GMAIL}}"
          

      - name: Commit and Push Helm Values
        run: |
          cd config-repo
          git add charts/producer/values.yaml

          git diff --cached --quiet && \
            echo "No changes to commit." && \
            exit 0

          git commit \
            -m "chore(producer): update image to ${{ github.sha }} [skip ci]"

          # Pulls from the config repo's main branch to prevent lock errors
          git pull --rebase origin main
          
          # Pushes directly to the external config repository
          git push origin main
          