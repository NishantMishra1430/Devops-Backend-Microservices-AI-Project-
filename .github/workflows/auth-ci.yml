name: Auth Service CI Pipeline 

on:
  push:
    branches:
      - main 
      - test 

    paths:
      - "auth-service/**"
      - ".github/workflows/auth-ci.yml"


jobs:
  Code-Lint-And-Review:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Credentials leak Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_ACCESS_TOKEN: ${{ secrets.GAT }}

  Building-Code-Artifacts:
    runs-on: ubuntu-latest
    needs: Code-Lint-And-Review
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4
      - name: Building Artifacts
        working-directory: "./auth-service"
        run: |
          pip install -r requirements.txt

  Image-Build-And-Scan-And-Register:
    runs-on: ubuntu-latest
    needs: [Code-Lint-And-Review,Building-Code-Artifacts]
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}
      - name: SetUp Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Image Build 
        uses: docker/build-push-action@v5
        with:
          context: "./auth-service"
          load: true
          tags: quant-auth-service:${{github.sha}}
      - name: Trivy Scan 
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'quant-auth-service:${{github.sha}}'
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL"
      - name: Push Image To DockerHub
        run: |
          docker tag quant-auth-service:${{github.sha}} ${{ secrets.DOCKER_USERNAME }}/quant-auth-service:${{github.sha}}
          docker push ${{ secrets.DOCKER_USERNAME }}/quant-auth-service:${{github.sha}}

  
  Helm:
    runs-on: ubuntu-latest
    needs: [Code-Lint-And-Review,Building-Code-Artifacts,Image-Build-And-Scan-And-Register]
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GAT }}
      - name: Service Image Updating
        run: |
          yq -i '.image.repository = "${{ secrets.DOCKER_USERNAME }}/quant-auth-service"' helm/charts/auth-service/values.yaml
          yq -i '.image.tag = "${{github.sha}}"' helm/charts/auth-service/values.yaml
          cat helm/charts/auth-service/values.yaml
      - name: Commit and Push To Trigger ArgoCD
        run: |
          git config user.name "${{ secrets.GUN }}"
          git config user.email "${{ secrets.GMAIL }}"
          git add helm/charts/auth-service/values.yaml
          git commit -m "chore(gitops): update auth-service image to ${{github.sha}}"
          git push -u origin ${{ github.ref_name }}
