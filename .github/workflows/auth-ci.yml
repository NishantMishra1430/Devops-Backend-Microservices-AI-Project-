name: Auth Service CI Pipeline 

on:
  push:
    branches:
      - main 
      - test 

    paths:
      - "auth-service/**"
      - ".github/workflows/auth-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "auth-service/**"
      - ".github/workflows/auth-ci.yml"

jobs:
  Code-Lint-And-Review:
    runs-on: ubuntu-latest

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Credentials leak Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GAT }}

  Build-Auth-Service:
    runs-on: ubuntu-latest
    needs: Code-Lint-And-Review
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4
      
      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.11" 

      - name: Install Dependencies
        working-directory: auth-service/
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          python -m compileall . # Checks for syntax errors in your Python files

  Image-Build-And-Scan-And-Register:
    runs-on: ubuntu-latest
    needs: [Code-Lint-And-Review, Build-Auth-Service]

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: SetUp Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Image Build 
        uses: docker/build-push-action@v5
        with:
          context: "./auth-service"
          load: true
          tags: quant-auth-service:${{github.sha}}

      - name: Trivy Scan 
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'quant-auth-service:${{github.sha}}'
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL"

      - name: Push Image To DockerHub
        run: |
          docker tag quant-auth-service:${{github.sha}} ${{ secrets.DOCKER_USERNAME }}/quant-auth-service:${{github.sha}}
          docker push ${{ secrets.DOCKER_USERNAME }}/quant-auth-service:${{github.sha}}

  Helm-GitOps-Update:
    runs-on: ubuntu-latest
    needs: [Code-Lint-And-Review, Build-Auth-Service, Image-Build-And-Scan-And-Register]

    concurrency:
      group: gitops-update
      cancel-in-progress: false
      queue: max

    if: github.event_name == 'push'
    steps:
      - name: Checkout Config Repository
        uses: actions/checkout@v4
        with:
          repository: NishantMishra1430/Config-Repo-of-DevOps-Backend-Microservices-Application-
          token: ${{ secrets.CONFIG_REPO_PAT }}
          path: config-repo
          fetch-depth: 0

      - name: Update Auth Service Image Tag
        run: |
          cd config-repo
          yq -i '.image.tag = "${{ github.sha }}"' charts/auth-service/values.yaml

      - name: Verify Helm Values Change
        run: |
          cd config-repo
          echo "Updated Auth Service image tag:"
          grep -A3 "^image:" charts/auth-service/values.yaml

      - name: Configure Git and Pull Latest State
        run: |
          cd config-repo
          git config user.name "${{secrets.GUN}}"
          git config user.email "${{secrets.GMAIL}}"
          

      - name: Commit and Push Helm Values
        run: |
          cd config-repo
          git add charts/auth-service/values.yaml

          git diff --cached --quiet && \
            echo "No changes to commit." && \
            exit 0

          git commit \
            -m "chore(auth-service): update image to ${{ github.sha }} [skip ci]"
          
          # Pulls from the config repo's main branch to prevent lock errors
          git pull --rebase origin main

          # Pushes directly to the external config repository
          git push origin main
          