name: Execution Engine Pipeline

on:
  push:
    branches:
      - test 
      - main
    paths:
      - "consumer/**"
      # - "helm/charts/execution-engine/**"
      - ".github/workflows/execution-engine-ci.yml"
  pull_request:
    branches:
      - main
jobs:
  Code-Lint-And-Review:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Credentials leak Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GAT }}

  Image-Build-And-Scan-And-Register:
    runs-on: ubuntu-latest
    needs: Code-Lint-And-Review
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}
      - name: SetUp Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Image Build 
        uses: docker/build-push-action@v5
        with:
          context: "./consumer"
          load: true
          tags: quant-execution-engine:${{github.sha}}
          file: "consumer/ex.en.Dockerfile"
      - name: Trivy Scan 
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'quant-execution-engine:${{github.sha}}'
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL"
      - name: Push Image To DockerHub
        run: |
          docker tag quant-execution-engine:${{github.sha}} ${{ secrets.DOCKER_USERNAME }}/quant-execution-engine:${{github.sha}}
          docker push ${{ secrets.DOCKER_USERNAME }}/quant-execution-engine:${{github.sha}}

  Helm:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [Code-Lint-And-Review,Image-Build-And-Scan-And-Register]

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GAT }}
      - name: Service Image Updating
        run: |
          yq -i '.image.repository = "${{ secrets.DOCKER_USERNAME }}/quant-execution-engine"' helm/charts/execution-engine/values.yaml
          yq -i '.image.tag = "${{github.sha}}"' helm/charts/execution-engine/values.yaml
          cat helm/charts/execution-engine/values.yaml
      - name: Commit and Push To Trigger ArgoCD
        run: |
          git config user.name "${{ secrets.GUN }}"
          git config user.email "${{ secrets.GMAIL }}"
          git add helm/charts/execution-engine/values.yaml
          git commit -m "chore(gitops): update quant-execution-engine-service image to ${{github.sha}} [skip ci]"
          git pull --rebase origin ${{ github.ref_name }}
          git push -u origin ${{ github.ref_name }}


