name: Quant Api Gateway CI Pipeline

on:
  push:
    branches:
      - test
      - main
    paths:
      - "api-gateway/**"
      - ".github/workflows/api-gateway-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "api-gateway/**"
      - ".github/workflows/api-gateway-ci.yml"

jobs:
  Code-Lint-And-Review:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Credentials Hardcoding Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GAT }}

  Image-Build-And-Scan-And-Register:
    runs-on: ubuntu-latest
    needs: Code-Lint-And-Review
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Image Build
        uses: docker/build-push-action@v5
        with:
          context: "./api-gateway"
          load: true
          tags: quant-api-gateway:${{github.sha}}

      - name: Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'quant-api-gateway:${{github.sha}}'
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL"

      - name: Push To DockerHub
        run: |
          docker tag quant-api-gateway:${{github.sha}} ${{ secrets.DOCKER_USERNAME }}/quant-api-gateway:${{github.sha}}
          docker push ${{ secrets.DOCKER_USERNAME }}/quant-api-gateway:${{github.sha}}

  Helm-GitOps-Update:
    runs-on: ubuntu-latest
    needs: Image-Build-And-Scan-And-Register

    concurrency:
      group: gitops-update
      cancel-in-progress: false
      queue: max

    if: github.event_name == 'push'

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GAT }}
          fetch-depth: 0

      - name: Update API Gateway Image Tag
        run: |
          yq -i '.image.tag = "${{ github.sha }}"' helm/charts/api-gateway/values.yaml

      - name: Verify Helm Values Change
        run: |
          echo "Updated API Gateway image tag:"
          grep -A3 "^image:" helm/charts/api-gateway/values.yaml

      - name: Configure Git
        run: |
          git config user.name "${{secrets.GUN}}"
          git config user.email "${{secrets.GMAIL}}"

      - name: Commit Helm Values
        run: |
          git add helm/charts/api-gateway/values.yaml

          git diff --cached --quiet && \
            echo "No changes to commit." && \
            exit 0

          git commit \
            -m "chore(api-gateway): update image to ${{ github.sha }}"
          git pull --rebase origin ${{github.ref_name}}

      - name: Push GitOps Change
        run: |
          git push origin HEAD:${{ github.ref_name }}