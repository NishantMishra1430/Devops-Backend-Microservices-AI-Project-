name: Quant Api Gateway CI Pipeline

on:
  push:
    branches:
      - test
      - main
    paths:
      - "api-gateway/**"
      - ".github/workflows/api-gateway-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "api-gateway/**"
      - ".github/workflows/api-gateway-ci.yml"

jobs:
  Code-Lint-And-Review:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Credentials Hardcoding Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GAT }}

  Code-Build:
    runs-on: ubuntu-latest
    needs: Code-Lint-And-Review
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4
      
      - name: NodeJS Setup
        uses: actions/setup-node@v3
        with:
          node-version: "24"

      - name: Install Dependencies
        working-directory: api-gateway/
        run: |
          npm install
          npm run build --if-present   


  Image-Build-And-Scan-And-Register:
    runs-on: ubuntu-latest
    needs: [Code-Lint-And-Review, Code-Build]
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Image Build
        uses: docker/build-push-action@v5
        with:
          context: "./api-gateway"
          load: true
          tags: quant-api-gateway:${{github.sha}}

      - name: Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'quant-api-gateway:${{github.sha}}'
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL"

      - name: Push To DockerHub
        run: |
          docker tag quant-api-gateway:${{github.sha}} ${{ secrets.DOCKER_USERNAME }}/quant-api-gateway:${{github.sha}}
          docker push ${{ secrets.DOCKER_USERNAME }}/quant-api-gateway:${{github.sha}}

  Helm-GitOps-Update:
    runs-on: ubuntu-latest
    needs: [Code-Lint-And-Review, Code-Build, Image-Build-And-Scan-And-Register]

    concurrency:
      group: gitops-update
      cancel-in-progress: false
      queue: max

    if: github.event_name == 'push'
    steps:
      - name: Checkout Config Repository
        uses: actions/checkout@v4
        with:
          repository: NishantMishra1430/Config-Repo-of-DevOps-Backend-Microservices-Application-
          token: ${{ secrets.CONFIG_REPO_PAT }}
          path: config-repo
          fetch-depth: 0

      - name: Update API Gateway Image Tag
        run: |
          cd config-repo
          yq -i '.image.tag = "${{ github.sha }}"' charts/api-gateway/values.yaml

      - name: Verify Helm Values Change
        run: |
          cd config-repo
          echo "Updated API Gateway image tag:"
          grep -A3 "^image:" charts/api-gateway/values.yaml

      - name: Configure Git and Pull Latest State
        run: |
          cd config-repo
          git config user.name "${{secrets.GUN}}"
          git config user.email "${{secrets.GMAIL}}"
          

      - name: Commit and Push Helm Values
        run: |
          cd config-repo
          git add charts/api-gateway/values.yaml

          git diff --cached --quiet && \
            echo "No changes to commit." && \
            exit 0

          git commit \
            -m "chore(api-gateway): update image to ${{ github.sha }} [skip ci]"

          # Pulls from the config repo's main branch to prevent lock errors
          git pull --rebase origin main
          
          # Pushes directly to the external config repository's main branch
          git push origin main
          