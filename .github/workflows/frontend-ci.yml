name: Frontend CI pipeline

on:
  push:
    branches:
      - test
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  Code-Review:
    runs-on: ubuntu-latest

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Credentials HardCoding Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GAT }}
  
  Code-Build:
    runs-on: ubuntu-latest
    needs: Code-Review
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4
      
      - name: NodeJS Setup
        uses: actions/setup-node@v3
        with:
          node-version: "24"

      - name: Install Dependencies
        working-directory: frontend/
        run: |
          npm install
          npm run build --if-present

  Image-Build-Scan-Push-To-Registry:
    runs-on: ubuntu-latest
    needs: [Code-Review, Code-Build]

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Image Build
        uses: docker/build-push-action@v5
        with:
          context: "./frontend"
          load: true
          tags: quant-frontend-service:${{ github.sha }}

      - name: Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "quant-frontend-service:${{ github.sha }}"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL"

      - name: Push To DockerHub
        run: |
          docker tag \
            quant-frontend-service:${{ github.sha }} \
            ${{ secrets.DOCKER_USERNAME }}/quant-frontend-service:${{ github.sha }}

          docker push \
            ${{ secrets.DOCKER_USERNAME }}/quant-frontend-service:${{ github.sha }}

  Helm-GitOps-Update:
    runs-on: ubuntu-latest
    needs: [Code-Review, Code-Build, Image-Build-Scan-Push-To-Registry]

    concurrency:
      group: gitops-update
      cancel-in-progress: false
      queue: max

    if: github.event_name == 'push'

    steps:
      - name: Checkout Config Repository
        uses: actions/checkout@v4
        with:
          repository: NishantMishra1430/Config-Repo-of-DevOps-Backend-Microservices-Application-
          token: ${{ secrets.CONFIG_REPO_PAT }}
          path: config-repo
          fetch-depth: 0

      - name: Update Frontend Image Tag
        run: |
          cd config-repo
          yq -i '.image.tag="${{ github.sha }}"' charts/frontend-service/values.yaml

      - name: Verify Helm Values Change
        run: |
          cd config-repo
          echo "Updated frontend image tag:"
          grep -A3 "^image:" charts/frontend-service/values.yaml

      - name: Configure Git and Pull Latest State
        run: |
          cd config-repo
          git config user.name "${{secrets.GUN}}"
          git config user.email "${{secrets.GMAIL}}"
          

      - name: Commit and Push Helm Values
        run: |
          cd config-repo
          git add charts/frontend-service/values.yaml

          git diff --cached --quiet && \
            echo "No changes to commit." && \
            exit 0

          git commit \
            -m "chore(frontend): update image to ${{ github.sha }} [skip ci]"
          
          # Pulls from the config repo's main branch to prevent lock errors
          git pull --rebase origin main
          
          # Pushes directly to the external config repository
          git push origin main