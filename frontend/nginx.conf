server {
    # Nginx listens on port 80 inside the container
    listen 80;
    server_name _;

    # The directory where the Vite build output is copied
    root /usr/share/nginx/html;
    index index.html;

    # --- 1. SPA Routing ---
    # Try to serve the exact file, then directory, then fallback to index.html for React routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- 2. API Reverse Proxy ---
    # Intercept API calls and route them internally to the API Gateway.
    # This completely eliminates CORS issues.

    location /auth/ {
        proxy_pass http://api-gateway:3000/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /market/ {
        proxy_pass http://api-gateway:3000/market/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /quant/ {
        proxy_pass http://api-gateway:3000/quant/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /trade/ {
        proxy_pass http://api-gateway:3000/trade/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # --- 3. WebSocket Reverse Proxy ---
    # Requires specific header upgrades to keep the persistent connection open
    location /ws/ {
        proxy_pass http://api-gateway:3000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400; # Keep connection alive for 24 hours
    }

    # --- 4. Performance Optimization ---
    # Enable GZIP compression to drastically reduce React bundle transfer size
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;
}